name: Release SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-nextjs/**"

  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  issues: write
  id-token: write

# Every release workflow in this repo pushes a `chore(release)` commit to main
# through @semantic-release/git, and they all share this one lock. Without it
# two of them run at once, the slower one's push is rejected with
# `! [rejected] (fetch first)`, and a release that actually succeeded is
# reported as a failed job — which is exactly what happened when a manual
# "Release SDK" dispatch overlapped the Release triggered by a merge.
#
# cancel-in-progress is false on purpose: a release half-done is worse than a
# release that waits its turn.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted

    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      # The lock above stops two releases running at once, but the job that
      # waited still checked out its code before the job ahead of it pushed.
      # Without this it would prepare its release on a stale main and be
      # rejected on push — the queue moves the race, it does not remove it.
      #
      # It sits here, straight after checkout, and not next to the release
      # step: by then the publish prep has deleted the root package.json and
      # bun.lock, and rebase refuses to run on a dirty tree.
      - name: Sync with main before releasing
        run: git pull --rebase origin main

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      # The SDK imports @glitchgrab/report-ui, whose package.json points main /
      # module / types at dist/ — and dist/ is gitignored. Without this step the
      # SDK build fails at "Could not resolve @glitchgrab/report-ui", not at a
      # type error. ci.yml already does this; keep the two in step.
      - name: Build shared report UI (workspace dependency of the SDK)
        run: bun run build
        working-directory: packages/report-ui

      - name: Build SDK
        run: bun run build
        working-directory: packages/sdk-nextjs

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
        working-directory: packages/sdk-nextjs

      - name: Prepare for npm publish
        run: |
          rm -f ../../bun.lock
          rm -f ../../package.json
        working-directory: packages/sdk-nextjs

      - name: Release
        run: npx semantic-release
        working-directory: packages/sdk-nextjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Self-heal: semantic-release pushes the git tag BEFORE npm publish, so a failed
      # publish leaves package.json/tag bumped while npm stays behind, and every later
      # run no-ops ("0 commits since last release"). This republishes whenever the exact
      # local version is missing from npm, recovering that stuck state automatically.
      - name: Reconcile npm registry
        working-directory: packages/sdk-nextjs
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          # npm STAGES a publish before finalising it, and a staged version is
          # invisible to `npm view`. 25s was shorter than that window, so a
          # perfectly good release looked stuck. Two minutes covers it.
          ON_NPM=false
          for i in $(seq 1 8); do
            if npm view "glitchgrab@${LOCAL}" version >/dev/null 2>&1; then
              ON_NPM=true
              break
            fi
            echo "glitchgrab@${LOCAL} not visible on npm yet (attempt ${i}/8) — registry may still be propagating or the publish may be staged, retrying..."
            sleep 15
          done

          if [ "$ON_NPM" = true ]; then
            echo "glitchgrab@${LOCAL} already on npm — in sync"
          else
            echo "glitchgrab@${LOCAL} still missing from npm — publishing to catch up"
            if ! npm publish --tag latest 2>publish.log; then
              # Any 409 means the version already exists on npm — published, or
              # staged and not yet finalised. Republishing can never be the
              # right answer to it, so it is success, not failure.
              #
              # Matching on the message text alone is what turned a good release
              # red: this grepped for "previously published versions" and npm
              # said `Cannot publish over previously staged version "1.38.0"`.
              # Different wording, different capitalisation, missed entirely —
              # and the step exited 1 on a package that had shipped fine.
              if grep -qiE "E409|cannot publish over (the )?previously (published|staged)" publish.log; then
                echo "npm already has ${LOCAL} (published or staged) — treating as in sync"
                cat publish.log
              else
                cat publish.log
                exit 1
              fi
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
