name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/sdk-nextjs/**"

  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Every release workflow in this repo pushes a `chore(release)` commit to main
# through @semantic-release/git, and they all share this one lock. Without it
# two of them run at once, the slower one's push is rejected with
# `! [rejected] (fetch first)`, and a release that actually succeeded is
# reported as a failed job — which is exactly what happened when a manual
# "Release SDK" dispatch overlapped the Release triggered by a merge.
#
# cancel-in-progress is false on purpose: a release half-done is worse than a
# release that waits its turn.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      # The lock above stops two releases running at once, but the job that
      # waited still checked out its code before the job ahead of it pushed.
      # Without this it would prepare its release on a stale main and be
      # rejected on push — the queue moves the race, it does not remove it.
      #
      # It sits here, straight after checkout, and not next to the release
      # step: by then the publish prep has deleted the root package.json and
      # bun.lock, and rebase refuses to run on a dirty tree.
      - name: Sync with main before releasing
        run: git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Versions are PINNED, and the pin on the preset is the load-bearing one.
      #
      # semantic-release 24 bundles conventional-changelog-writer@8. The
      # conventionalcommits preset went to writer@9 in its v10, so installing it
      # unpinned resolves to a preset the bundled writer cannot render, and the
      # release dies in generateNotes with:
      #
      #   Missing helper: "conventional-changelog-conventionalcommits requires
      #   conventional-changelog-writer@9 or newer"
      #
      # Nothing in the repo changes to trigger that — it breaks on its own the
      # day the preset publishes a major. Bump these together, never one alone.
      - name: Install semantic-release plugins
        run: npm install -g semantic-release@24 @semantic-release/changelog@6 @semantic-release/git@10 conventional-changelog-conventionalcommits@8

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
