name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/sdk-nextjs/**"

  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: self-hosted
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Versions are PINNED, and the pin on the preset is the load-bearing one.
      #
      # semantic-release 24 bundles conventional-changelog-writer@8. The
      # conventionalcommits preset went to writer@9 in its v10, so installing it
      # unpinned resolves to a preset the bundled writer cannot render, and the
      # release dies in generateNotes with:
      #
      #   Missing helper: "conventional-changelog-conventionalcommits requires
      #   conventional-changelog-writer@9 or newer"
      #
      # Nothing in the repo changes to trigger that — it breaks on its own the
      # day the preset publishes a major. Bump these together, never one alone.
      - name: Install semantic-release plugins
        run: npm install -g semantic-release@24 @semantic-release/changelog@6 @semantic-release/git@10 conventional-changelog-conventionalcommits@8

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
