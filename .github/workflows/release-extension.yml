name: Release Extension

# Ships packages/extension to the Chrome Web Store.
#
# No Chrome Web Store credentials live here. The store account is connected once
# in Glitchgrab (Extensions → Connect Google account) and this workflow talks to
# Glitchgrab with a single `gg_` token. That is what removes the four secrets,
# the seven-day refresh-token expiry and the rotation cron the old per-repo
# setup needed.
#
# The verdict is NOT this workflow's to report. Google reviews for hours or
# days, long after this job exits; `cron/extension-watch` polls and WhatsApps
# the outcome. A green tick here means "submitted", nothing more.

on:
  push:
    branches: [main]
    paths:
      - "packages/extension/**"

  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Build and zip only — do not submit to the store"
        required: false
        default: false
        type: boolean

permissions:
  # write, not read: the last step pushes a version tag.
  contents: write

jobs:
  release:
    name: Build & submit to the Chrome Web Store
    runs-on: ubuntu-latest
    # A release commit pushing itself back would loop.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to read the commits since the last release and infer the bump.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Work out the bump
        id: bump
        env:
          EVENT: ${{ github.event_name }}
          # A choice input, so GitHub already limits it to the three options —
          # through env anyway, because nothing from the event context belongs
          # inline in a shell line.
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "type=$REQUESTED_BUMP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conventional commits touching the extension since the last release
          # tag. `feat!` / BREAKING CHANGE wins, then feat, else patch.
          LAST_TAG=$(git tag --list 'extension-v*' --sort=-v:refname | head -1)
          RANGE=${LAST_TAG:+${LAST_TAG}..HEAD}
          COMMITS=$(git log --format="%s%n%b" ${RANGE:-HEAD} -- packages/extension/ || true)

          BUMP=patch
          if echo "$COMMITS" | grep -qiE '^[a-z]+(\(.*\))?!:|BREAKING CHANGE'; then
            BUMP=major
          elif echo "$COMMITS" | grep -qiE '^feat(\(|:)'; then
            BUMP=minor
          fi
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Inferred bump: $BUMP"

      - name: Ask Glitchgrab for the next version
        id: version
        env:
          GG_TOKEN: ${{ secrets.GLITCHGRAB_TOKEN }}
          GG_API: ${{ vars.GLITCHGRAB_API_URL || 'https://glitchgrab.dev' }}
          BUMP: ${{ steps.bump.outputs.type }}
        run: |
          if [ -z "$GG_TOKEN" ]; then
            echo "::error::GLITCHGRAB_TOKEN is not set. Create a token for this repo in Glitchgrab → API Tokens."
            exit 1
          fi

          # The store is the source of truth for the version, but send what is
          # checked out too: Glitchgrab takes the highest of the three, so a
          # store read that comes back empty can never hand back a version
          # lower than the one already shipped.
          CURRENT=$(node -p "require('./packages/extension/src/manifest.json').version")

          RESPONSE=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $GG_TOKEN" \
            "$GG_API/api/v1/extensions/release?bump=$BUMP&current=$CURRENT")

          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -1)

          if [ "$CODE" = "405" ]; then
            # Next.js matched /extensions/[id] instead, because the release
            # route is not in the deployed build. A 404 would have said this;
            # 405 does not, so say it here.
            echo "::error::$GG_API has no release endpoint yet — deploy Glitchgrab, then re-run this job."
            exit 1
          fi

          if [ "$CODE" != "200" ]; then
            echo "::error::Glitchgrab said $CODE: $(echo "$BODY" | jq -r '.error // .')"
            exit 1
          fi

          VERSION=$(echo "$BODY" | jq -r '.data.version')
          LIVE=$(echo "$BODY" | jq -r '.data.publishedVersion // "none"')
          BASED_ON=$(echo "$BODY" | jq -r '.data.basedOn // "nothing"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Live on the store: $LIVE | in the repo: $CURRENT | bumped from: $BASED_ON → releasing $VERSION"

      # Every value that came off the network goes through `env:`, never straight
      # into a run block. The version arrives in an HTTP response, and a string
      # spliced into `node -e` or a shell line is an injection waiting for the
      # day that response is not ours.
      - name: Stamp the version
        working-directory: packages/extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error('Refusing to stamp a version that is not x.y.z: ' + version);
            }
            for (const f of ['package.json', 'src/manifest.json']) {
              const json = JSON.parse(fs.readFileSync(f, 'utf-8'));
              json.version = version;
              fs.writeFileSync(f, JSON.stringify(json, null, 2) + '\n');
            }
          "

      - name: Build and zip
        working-directory: packages/extension
        run: bun run zip

      - name: Keep the package, whatever happens next
        uses: actions/upload-artifact@v4
        with:
          name: extension-v${{ steps.version.outputs.version }}
          path: packages/extension/glitchgrab-extension.zip
          retention-days: 30

      - name: Submit to the Chrome Web Store
        if: github.event_name == 'push' || inputs.dry_run != true
        env:
          GG_TOKEN: ${{ secrets.GLITCHGRAB_TOKEN }}
          GG_API: ${{ vars.GLITCHGRAB_API_URL || 'https://glitchgrab.dev' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $GG_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @packages/extension/glitchgrab-extension.zip \
            "$GG_API/api/v1/extensions/release")

          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -1)

          if [ "$CODE" = "405" ]; then
            echo "::error::$GG_API has no release endpoint yet — deploy Glitchgrab, then re-run this job."
            exit 1
          fi

          if [ "$CODE" != "200" ]; then
            # A real failure, unlike the bare 400 the old bpp action returned on
            # submissions that had actually succeeded.
            echo "::error::Submission failed ($CODE): $(echo "$BODY" | jq -r '.error // .')"
            exit 1
          fi

          echo "::notice::Submitted v$VERSION for review. Google's verdict arrives on WhatsApp — this tick only means it was accepted for review."

      - name: Tag the release
        if: github.event_name == 'push' || inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A tag, not a commit: the version is stamped at build time and the
          # store holds the truth, so pushing the bump back would only add a
          # commit that has to be skipped by CI anyway.
          git tag "extension-v$VERSION"
          git push origin "extension-v$VERSION"
